services:
  postgres-prod:
    image: postgres:16-alpine
    container_name: mt-db-prod
    restart: unless-stopped
    env_file:
      - .env.prod
    volumes:
      - postgres-prod:/var/lib/postgresql/data
    networks:
      - mt-network-prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend-prod:
    image: rrtyuisess/moneytracker:backend-1.1.0
    container_name: mt-backend-prod
    restart: unless-stopped
    env_file:
      - .env.prod
    depends_on:
      postgres-prod:
        condition: service_healthy
    networks:
      - mt-network-prod

  frontend-prod:
    # Используем конкретный тег из Docker Hub
    image: rrtyuisess/moneytracker:frontend-1.1.0
    container_name: mt-frontend-prod
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend-prod
    networks:
      - mt-network-prod

networks:
  mt-network-prod:
    driver: bridge

volumes:
  postgres-prod: